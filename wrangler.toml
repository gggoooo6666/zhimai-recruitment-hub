name = "zhimai-recruitment-hub"
main = "worker/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "zhimai-hr.online", custom_domain = true },
  { pattern = "www.zhimai-hr.online", custom_domain = true },
]

# 生产环境变量，在 Cloudflare 控制台或 wrangler secret 中设置
# OPENAI_API_KEY = ""
# OPENAI_MODEL = "gpt-5.6-terra"
# ACCESS_PASSWORD = "你的访问密码"
# COLLABORATION_ALLOWED_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "zhimai-recruitment-hub-db"
database_id = "8d2b5798-e1ce-436e-9d83-719817cee63e"
migrations_dir = "drizzle"
